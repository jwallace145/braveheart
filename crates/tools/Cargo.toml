[package]
name = "braveheart-tools"
version = "0.55.1"
description = "Developer tools: perft suite runner, performance gate, bench and speed reports, openings, SPRT, match and rating reports, nnue-scale"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "braveheart_tools"

[[bin]]
name = "perf-gate"
path = "src/bin/perf_gate.rs"

[[bin]]
name = "bench-history"
path = "src/bin/bench_history.rs"

[[bin]]
name = "bench-report"
path = "src/bin/bench_report.rs"

[[bin]]
name = "openings"
path = "src/bin/openings.rs"

[[bin]]
name = "nnue-scale"
path = "src/bin/nnue_scale.rs"

[[bin]]
name = "speed-report"
path = "src/bin/speed_report.rs"

[[bin]]
name = "rating-report"
path = "src/bin/rating_report.rs"

[[bin]]
name = "match-report"
path = "src/bin/match_report.rs"

[[bin]]
name = "sprt-report"
path = "src/bin/sprt_report.rs"

[dependencies]
braveheart-core = { path = "../core" }
braveheart-search = { path = "../search" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[lints]
workspace = true
